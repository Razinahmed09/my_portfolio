<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills — Marquee Section</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Font Awesome 6 (for concept icons: SEO, speed, accessibility, bug-fixing etc.) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ======================================================================
   ALL rules below are nested under .razin-skills-section so nothing here
   can leak out to or clash with other sections on the page. No CSS
   custom properties are used — every color is a hardcoded literal value,
   so there is zero risk of variable-name collisions with other sections.
   ====================================================================== */

.razin-skills-section{
  background:#0a0509;
  color:#f5f0f3;
  font-family:'Inter',sans-serif;
  padding:100px 0 110px;
  overflow:hidden;
  position:relative;
  isolation:isolate;
}

/* faint ambient glow to match dark pink editorial feel */
.razin-skills-section::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 12% 15%, rgba(236,19,128,0.10), transparent 42%),
    radial-gradient(circle at 88% 85%, rgba(255,79,163,0.08), transparent 42%);
  pointer-events:none;
  z-index:0;
}

/* ---------- Background vector layer (low-opacity floating shapes) ---------- */
.razin-skills-section .sk-vectors{
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
}
.razin-skills-section .sk-vectors svg{
  position:absolute;
  opacity:0.07;
  filter:blur(0.3px);
}
.razin-skills-section .sk-vec-1{ top:4%; left:5%; width:140px; animation:razin-sk-float-a 16s ease-in-out infinite; }
.razin-skills-section .sk-vec-2{ top:62%; left:10%; width:90px; animation:razin-sk-float-b 13s ease-in-out infinite; }
.razin-skills-section .sk-vec-3{ top:10%; left:80%; width:170px; animation:razin-sk-float-a 19s ease-in-out infinite reverse; }
.razin-skills-section .sk-vec-4{ top:70%; left:85%; width:110px; animation:razin-sk-float-b 15s ease-in-out infinite; }
.razin-skills-section .sk-vec-5{ top:38%; left:46%; width:220px; animation:razin-sk-rotate-slow 40s linear infinite; }

@keyframes razin-sk-float-a{
  0%, 100%{ transform:translate(0,0) rotate(0deg); }
  50%{ transform:translate(18px,-22px) rotate(8deg); }
}
@keyframes razin-sk-float-b{
  0%, 100%{ transform:translate(0,0) rotate(0deg); }
  50%{ transform:translate(-16px,16px) rotate(-10deg); }
}
@keyframes razin-sk-rotate-slow{
  from{ transform:rotate(0deg); }
  to{ transform:rotate(360deg); }
}

@media (prefers-reduced-motion: reduce){
  .razin-skills-section .sk-vec-1,
  .razin-skills-section .sk-vec-2,
  .razin-skills-section .sk-vec-3,
  .razin-skills-section .sk-vec-4,
  .razin-skills-section .sk-vec-5{
    animation:none;
  }
}

.razin-skills-section .sk-eyebrow{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-size:12px;
  letter-spacing:0.35em;
  text-transform:uppercase;
  color:#9a7e90;
  margin-bottom:18px;
}
.razin-skills-section .sk-eyebrow .sk-dot{
  width:6px;height:6px;border-radius:50%;
  background:#ff4fa3;
  box-shadow:0 0 10px 2px rgba(236,19,128,0.18);
}

.razin-skills-section .sk-heading{
  text-align:center;
  font-weight:800;
  font-size:clamp(2.4rem, 5vw, 3.6rem);
  letter-spacing:-0.02em;
  margin-bottom:14px;
  position:relative;
  z-index:1;
}
.razin-skills-section .sk-heading span{
  background:linear-gradient(90deg, #ec1380 0%, #ff4fa3 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.razin-skills-section .sk-subtext{
  text-align:center;
  color:#9a7e90;
  max-width:540px;
  margin:0 auto 64px;
  font-size:15px;
  line-height:1.7;
  position:relative;
  z-index:1;
}

/* ---------- Marquee mechanics ---------- */
.razin-skills-section .sk-marquee-wrap{
  position:relative;
  width:100%;
  z-index:1;
}

.razin-skills-section .sk-row{
  display:flex;
  overflow:hidden;
  position:relative;
  margin-bottom:28px;
  /* edge fade mask — dissolves into background */
  -webkit-mask-image:linear-gradient(90deg, transparent 0%, #000 10%, #000 90%, transparent 100%);
  mask-image:linear-gradient(90deg, transparent 0%, #000 10%, #000 90%, transparent 100%);
}
.razin-skills-section .sk-row:last-child{ margin-bottom:0; }

.razin-skills-section .sk-track{
  display:flex;
  gap:18px;
  flex-shrink:0;
  width:max-content;
  will-change:transform;
  padding:10px 0;
}

.razin-skills-section .sk-track.sk-left{
  animation:razin-sk-scroll-left 32s linear infinite;
}
.razin-skills-section .sk-track.sk-right{
  animation:razin-sk-scroll-right 32s linear infinite;
}

/* Pause whole row on hover */
.razin-skills-section .sk-row:hover .sk-track{
  animation-play-state:paused;
}

@keyframes razin-sk-scroll-left{
  from{ transform:translateX(0); }
  to{ transform:translateX(-50%); }
}
@keyframes razin-sk-scroll-right{
  from{ transform:translateX(-50%); }
  to{ transform:translateX(0); }
}

/* ---------- Skill pill card ---------- */
.razin-skills-section .sk-card{
  display:flex;
  align-items:center;
  gap:14px;
  background:#160c14;
  border:1.5px solid #3a1830;
  border-radius:14px;
  padding:16px 26px;
  white-space:nowrap;
  position:relative;
  transition:border-color .35s ease, transform .35s ease, box-shadow .35s ease, background .35s ease;
}

.razin-skills-section .sk-card:hover{
  border-color:#ff4fa3;
  transform:translateY(-6px) scale(1.02);
  background:#1d0e18;
  box-shadow:
    0 16px 34px -10px rgba(0,0,0,0.6),
    0 0 0 1px rgba(236,19,128,0.18),
    0 0 26px rgba(236,19,128,0.35);
}

.razin-skills-section .sk-icon-wrap{
  width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  background:#000;
  border:1.5px solid #3a1830;
  transition:border-color .35s ease, box-shadow .35s ease;
}
.razin-skills-section .sk-card:hover .sk-icon-wrap{
  border-color:#ff4fa3;
  box-shadow:0 0 16px rgba(236,19,128,0.5);
}

.razin-skills-section .sk-icon-wrap img{
  width:20px;
  height:20px;
  object-fit:contain;
  display:block;
}
.razin-skills-section .sk-icon-wrap i{
  font-size:16px;
  color:#ff4fa3;
  transition:color .35s ease;
}
.razin-skills-section .sk-card:hover .sk-icon-wrap i{
  color:#ffffff;
}

.razin-skills-section .sk-label{
  font-size:15.5px;
  font-weight:600;
  color:#f5f0f3;
  letter-spacing:0.01em;
}

/* Concept-icon card variant (Font Awesome icon instead of brand logo image) */
.razin-skills-section .sk-card.sk-concept .sk-icon-wrap{
  background:rgba(236,19,128,0.18);
  border:1.5px solid #3a1830;
}

/* Reduced motion accessibility */
@media (prefers-reduced-motion: reduce){
  .razin-skills-section .sk-track.sk-left,
  .razin-skills-section .sk-track.sk-right{
    animation:none;
  }
  .razin-skills-section .sk-row{ overflow-x:auto; }
}

/* Responsive tuning */
@media (max-width:768px){
  .razin-skills-section{ padding:70px 0 80px; }
  .razin-skills-section .sk-subtext{ margin-bottom:46px; }
  .razin-skills-section .sk-card{ padding:13px 20px; gap:11px; }
  .razin-skills-section .sk-icon-wrap{ width:32px; height:32px; }
  .razin-skills-section .sk-icon-wrap img{ width:17px; height:17px; }
  .razin-skills-section .sk-label{ font-size:14px; }
  .razin-skills-section .sk-track{ gap:14px; }
  .razin-skills-section .sk-row{ margin-bottom:20px; }
}
</style>
</head>
<body>

<section class="razin-skills-section">
  <div class="sk-vectors">
    <svg class="sk-vec-1" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="70" cy="70" r="68" stroke="#ec1380" stroke-width="1.5"/>
      <circle cx="70" cy="70" r="46" stroke="#ec1380" stroke-width="1"/>
    </svg>
    <svg class="sk-vec-2" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="2" width="86" height="86" rx="18" stroke="#ff4fa3" stroke-width="1.5"/>
    </svg>
    <svg class="sk-vec-3" viewBox="0 0 170 170" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="85,5 160,45 160,125 85,165 10,125 10,45" stroke="#ec1380" stroke-width="1.3"/>
    </svg>
    <svg class="sk-vec-4" viewBox="0 0 110 110" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M55 5 L105 55 L55 105 L5 55 Z" stroke="#ff4fa3" stroke-width="1.4"/>
    </svg>
    <svg class="sk-vec-5" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="110" cy="110" r="100" stroke="#ec1380" stroke-width="1" stroke-dasharray="4 10"/>
      <circle cx="110" cy="110" r="70" stroke="#ff4fa3" stroke-width="1" stroke-dasharray="2 8"/>
    </svg>
  </div>

  <div class="container">
    <div class="sk-eyebrow"><span class="sk-dot"></span> What I work with</div>
    <h2 class="sk-heading">My <span>Skills</span></h2>
    <p class="sk-subtext">Tools and technologies I use to design, build, and ship fast, polished web experiences.</p>
  </div>

  <div class="sk-marquee-wrap">

    <!-- Row 1 : scrolls LEFT -->
    <div class="sk-row">
      <div class="sk-track sk-left" id="sk-track-1">
        <!-- duplicated automatically by JS for seamless loop -->
      </div>
    </div>

    <!-- Row 2 : scrolls RIGHT -->
    <div class="sk-row">
      <div class="sk-track sk-right" id="sk-track-2">
        <!-- duplicated automatically by JS for seamless loop -->
      </div>
    </div>

  </div>
</section>

<script>
  // Skill data — real brand logos via Simple Icons CDN where a brand exists.
  // For skills with no real brand logo (SEO, performance, accessibility, etc.)
  // we use a proper Font Awesome concept icon instead of plain text, so every
  // card in the marquee looks visually consistent.
  const row1Skills = [
    { name: "HTML5",    icon: "https://cdn.simpleicons.org/html5/E34F26" },
    { name: "CSS3",     icon: "https://cdn.simpleicons.org/css3/1572B6" },
    { name: "Tailwind CSS", icon: "https://cdn.simpleicons.org/tailwindcss/38BDF8" },
    { name: "Bootstrap", icon: "https://cdn.simpleicons.org/bootstrap/7952B3" },
    { name: "React.js", icon: "https://cdn.simpleicons.org/react/61DAFB" },
    { name: "JavaScript (ES6+)", icon: "https://cdn.simpleicons.org/javascript/F7DF1E" },
    { name: "jQuery",   icon: "https://cdn.simpleicons.org/jquery/0769AD" },
    { name: "GSAP",     icon: "https://cdn.simpleicons.org/greensock/88CE02" },
    { name: "Figma",    icon: "https://cdn.simpleicons.org/figma/F24E1E" },
    { name: "Adobe Photoshop", icon: "https://cdn.simpleicons.org/adobephotoshop/31A8FF" },
  ];

  const row2Skills = [
    { name: "Git, GitHub & GitLab", icon: "https://cdn.simpleicons.org/git/F05032" },
    { name: "Responsive Web Design", fa: "fa-solid fa-mobile-screen-button" },
    { name: "Cross-Browser Compatibility", fa: "fa-solid fa-globe" },
    { name: "SEO Optimization", fa: "fa-solid fa-magnifying-glass-chart" },
    { name: "Website Performance Optimization", fa: "fa-solid fa-gauge-high" },
    { name: "Core Web Vitals", fa: "fa-solid fa-chart-line" },
    { name: "Page Speed Optimization", fa: "fa-solid fa-bolt" },
    { name: "AOS Animations", fa: "fa-solid fa-wand-magic-sparkles" },
    { name: "Bug Fixing & Troubleshooting", fa: "fa-solid fa-bug" },
    { name: "Web Accessibility (WCAG)", fa: "fa-solid fa-universal-access" },
    { name: "UI Development", fa: "fa-solid fa-layer-group" },
  ];

  function buildCard(skill){
    const card = document.createElement("div");
    if(skill.icon){
      card.className = "sk-card";
      card.innerHTML = `
        <div class="sk-icon-wrap"><img src="${skill.icon}" alt="${skill.name} logo" loading="lazy"></div>
        <span class="sk-label">${skill.name}</span>
      `;
    } else {
      card.className = "sk-card sk-concept";
      card.innerHTML = `
        <div class="sk-icon-wrap"><i class="${skill.fa}"></i></div>
        <span class="sk-label">${skill.name}</span>
      `;
    }
    return card;
  }

  function fillTrack(trackId, skills){
    const track = document.getElementById(trackId);
    // duplicate the set twice so the 50% translate loop is seamless
    for(let i=0; i<2; i++){
      skills.forEach(skill => track.appendChild(buildCard(skill)));
    }
  }

  fillTrack("sk-track-1", row1Skills);
  fillTrack("sk-track-2", row2Skills);

  // Equalize visual speed across rows: duration is proportional to the
  // half-track width (one full set), so every card moves at the same
  // px/sec regardless of how many items are in a row.
  function syncMarqueeSpeed(){
    const PX_PER_SEC = 38; // tune this single number to speed up/slow down both rows
    document.querySelectorAll(".razin-skills-section .sk-track").forEach(track => {
      const halfWidth = track.scrollWidth / 2;
      const duration = halfWidth / PX_PER_SEC;
      track.style.animationDuration = duration + "s";
    });
  }

  window.addEventListener("load", syncMarqueeSpeed);
  window.addEventListener("resize", syncMarqueeSpeed);
</script>

</body>
</html>
